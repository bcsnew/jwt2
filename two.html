<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>
<style>
body {
font-family: Arial, sans-serif;
background: rgb(238, 242, 247);
margin: 0;
padding: 20px;
}
.box {
max-width: 480px;
margin: 0 auto;
background: white;
padding: 24px;
border-radius: 6px;
box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
h2 {
text-align: center;
color: rgb(44, 62, 80);
margin-top: 0;
}
.field {
margin-bottom: 14px;
}
label {
display: block;
margin-bottom: 4px;
font-weight: bold;
color: rgb(52, 73, 94);
}
input, select {
width: 100%;
padding: 8px;
border: 1px solid rgb(189, 195, 199);
border-radius: 4px;
box-sizing: border-box;
}
button {
width: 100%;
padding: 10px;
background: rgb(39, 174, 96);
color: white;
border: none;
border-radius: 4px;
font-size: 16px;
cursor: pointer;
}
button:hover {
background: rgb(33, 145, 80);
}
</style>
</head>
<body>
<div class="box">
<h2>Student Registration Form</h2>
<form action="javascript:void(0)" method="post">
<div class="field">
<label for="rollno">Roll Number</label>
<input type="number" id="rollno" name="rollno" required min="1" max="9999" placeholder="Enter roll number">
</div>
<div class="field">
<label for="sname">Student Name</label>
<input type="text" id="sname" name="sname" required pattern="[A-Za-z ]{3,40}" placeholder="Enter student name">
</div>
<div class="field">
<label for="semail">Student Email</label>
<input type="email" id="semail" name="semail" required placeholder="Enter student email">
</div>
<div class="field">
<label for="phone">Contact Number</label>
<input type="tel" id="phone" name="phone" required pattern="[0-9]{10}" placeholder="10-digit mobile number">
</div>
<div class="field">
<label for="department">Department</label>
<select id="department" name="department" required>
<option value="">Select Department</option>
<option value="cs">Computer Science</option>
<option value="math">Mathematics</option>
<option value="stat">Statistics</option>
<option value="elect">Electronics</option>
</select>
</div>
<div class="field">
<label for="semester">Semester</label>
<input type="number" id="semester" name="semester" required min="1" max="6" placeholder="Enter semester (1-6)">
</div>
<button type="submit">Register Student</button>
</form>
</div>
</body>
</html>
